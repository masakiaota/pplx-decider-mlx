[project]
name = "decider-mlx"
version = "0.1.0.dev0"
description = "MLX inference engine for Perplexity Decider v1.3 models on Apple silicon Macs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "huggingface-hub==1.31.0",
  "mlx==0.32.5",
  "mlx-metal==0.32.5",
  "numpy==2.5.5",
  "pillow==12.3.0",
  "psutil==7.2.2",
  "tokenizers==0.23.3",
]

[project.scripts]
decider-mlx = "decider_mlx.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

# MLX 0.32.5 is not on PyPI yet. decider-mlx uses the wheels that MLX's own CI built at ml-explore/mlx commit
# fc344c9 (version 0.32.5, includes PR #4682; nightly run 44033175204). CI artifacts expire, so the two unmodified
# wheels are re-hosted on this repository's GitHub Release "mlx-0.32.5-fc344c9"; uv.lock pins their sha256.
# They are faster than a local source build (Flash 5-7% at 12.9K tokens; otherwise within 1%) because the
# built-in Metal kernels are compiled with MLX's CI toolchain. When mlx==0.32.5 is on PyPI, remove [tool.uv.sources] and relock.
[tool.uv.sources]
mlx = { url = "https://github.com/masakiaota/pplx-decider-mlx/releases/download/mlx-0.32.5-fc344c9/mlx-0.32.5-cp314-cp314-macosx_27_0_arm64.whl" }
mlx-metal = { url = "https://github.com/masakiaota/pplx-decider-mlx/releases/download/mlx-0.32.5-fc344c9/mlx_metal-0.32.5-py3-none-macosx_27_0_arm64.whl" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# Precompile .pyc at install (faster first import).
compile-bytecode = true
